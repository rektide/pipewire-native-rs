[package]
name = "pipewire-native-stress"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
pipewire-native-node = { path = "../node" }
pipewire-native-protocol = { path = "../protocol" }
pipewire-native-spa = { path = "../spa" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"

[workspace]
members = ["."]

[[bin]]
name = "pw-stress"
path = "src/main.rs"

[[bin]]
name = "pw-stress-report"
path = "src/report_main.rs"

[[bin]]
name = "pw-criterion-marker"
path = "src/criterion_marker_main.rs"

[[bench]]
name = "subsystems"
harness = false

[dev-dependencies]
criterion = "0.8.2"
